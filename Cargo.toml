[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-governor = "0.10.0"
actix-web = "4.15.0"
bcrypt = "0.19.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mongodb = "3.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
validator = { version = "0.21.0", features = ["derive"] }


